[project]
name = "vla"
version = "0.1.0"
description = "Closed-loop VLA post-training pipeline (MuJoCo, FSDP2, GRPO)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.6",
  "transformers>=4.46",
  "mujoco>=3.2",
  "gymnasium>=1.0",
  "robot_descriptions",
  "h5py",
  "imageio[ffmpeg]",
  "pyyaml",
  "numpy",
  "tensorboard",
]

[project.optional-dependencies]
# Remote server only. Local `uv sync` does not install extras.
gpu = ["deepspeed", "flash-attn"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla"]

[tool.uv]
# flash-attn needs torch at build time
no-build-isolation-package = ["flash-attn"]
